<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dietary compounds and amyloid membrane study schematic</title>
  <desc id="desc">An original schematic of four compounds evaluated in a synthetic brain membrane model with amyloid beta 25 to 35.</desc>
  <rect width="1200" height="760" fill="#f4f1ea"/>
  <text x="72" y="78" fill="#18352b" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3">GROUNDED STUDY SCHEMATIC</text>
  <text x="72" y="126" fill="#1c1c1a" font-family="Georgia, serif" font-size="36">Four compounds. One controlled membrane model.</text>
  <g font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g transform="translate(95 195)"><circle cx="90" cy="76" r="66" fill="#9f4c3b"/><text x="90" y="82" fill="#fff">RESVERATROL</text></g>
    <g transform="translate(355 195)"><circle cx="90" cy="76" r="66" fill="#315f70"/><text x="90" y="82" fill="#fff">CAFFEINE</text></g>
    <g transform="translate(615 195)"><circle cx="90" cy="76" r="66" fill="#d07b2d"/><text x="90" y="72" fill="#fff">BETA-</text><text x="90" y="94" fill="#fff">CAROTENE</text></g>
    <g transform="translate(875 195)"><circle cx="90" cy="76" r="66" fill="#3a735c"/><text x="90" y="82" fill="#fff">EGCG</text></g>
  </g>
