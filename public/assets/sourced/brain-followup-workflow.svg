<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Brain metastasis follow-up workflow schematic</title><desc id="desc">Original schematic showing treated lesion contours registered from pre-radiotherapy imaging into follow-up MRI.</desc>
